services:
  - type: web
    name: inmueblespy
    runtime: static
    buildCommand: echo "Pre-rendered HTML checked before deployment"
    staticPublishPath: ./site
    # No redirect route for the site root: Render documents that it "does not
    # apply redirect or rewrite rules to a path if a resource exists at that
    # path", and that rules cannot be applied to the domain root at all. A rule
    # here was dead config - verified against production, where both / and
    # /index.html answer 200 and serve the file.
    #
    # site/index.html is therefore the mechanism: a noindex stub whose canonical
    # points at /es/ and which refreshes there immediately. For a real 301, add
    # a Redirect Rule at Cloudflare, which sits in front of this domain. See
    # DEPLOY.md.
    domains:
      - inmueblespy.com.py
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' https://morarnoparaguai.com.br data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /sitemaps/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /es/*
        name: Cache-Control
        value: public, max-age=600, must-revalidate
      - path: /pt-br/*
        name: Cache-Control
        value: public, max-age=600, must-revalidate
